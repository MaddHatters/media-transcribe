<!DOCTYPE html>
<html>
<head><title>Preflight A/V Test</title></head>
<body style="margin:0;background:#16a085;color:#fff;font-family:sans-serif;
             display:flex;align-items:center;justify-content:center;
             height:100vh;flex-direction:column">
<h1 style="font-size:4em;margin:0">Preflight A/V Test</h1>
<p id="status" style="font-size:2em">Starting audio...</p>
<div style="display:flex;gap:20px;margin-top:30px">
  <div style="width:120px;height:120px;background:#e74c3c;border-radius:20px"></div>
  <div style="width:120px;height:120px;background:#f1c40f;border-radius:20px"></div>
  <div style="width:120px;height:120px;background:#3498db;border-radius:20px"></div>
  <div style="width:120px;height:120px;background:#9b59b6;border-radius:20px"></div>
</div>
<script>
const ctx = new AudioContext();
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.type = 'sine';
osc.frequency.value = 440;
gain.gain.value = 0.5;
osc.connect(gain);
gain.connect(ctx.destination);
osc.start();
document.getElementById('status').textContent = 'AUDIO PLAYING — 440 Hz';
</script>
</body>
</html>
