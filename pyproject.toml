[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-transcribe"
version = "0.1.0"
description = "Local, offline transcription of video folders with Whisper large-v3 (faster-whisper)."
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Only needed on the Windows capture box: uv sync --extra capture
capture = [
    "playwright>=1.44",
    "obsws-python>=1.7",
    "websockets>=12",
]
# Local, free slide OCR (no cloud): uv sync --extra ocr
ocr = [
    "rapidocr-onnxruntime>=1.3",
    "pillow>=10",
    "av>=12",
    "numpy>=1.26",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "websockets>=12",
    "grpcio>=1.60",
]
agent = [
    "grpcio>=1.60",
]

[dependency-groups]
# Installed by default with `uv run`/`uv sync`.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "grpcio-tools>=1.60",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src", "web", "proto", "agent"]

[tool.uv]
# Pin nothing exotic; CPU-only by default. See README for GPU/Mac notes.
