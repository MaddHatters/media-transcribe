project: FIRE Investing Masterclass — Analysis & Expert System
description: >
  Turn the FIRE Investing Masterclass video library (and later, other Patreon
  content) into a set of specialized, highly-accurate AI expert agents for stock
  selection, evaluation, portfolio construction, and ongoing market monitoring.
end_goal: >
  Domain-specialized AI agents, each with a singular focus, that are very good
  and very accurate at their specific area — composed together into a system that
  can analyze tickers, build/maintain portfolios, and surface insights on a
  schedule, while continually learning as more material is ingested.

conventions:
  status_values: [done, in_progress, planned, blocked]
  transcripts_dir: "/mnt/secondary/FIRE Investing Masterclass/transcripts"
  videos_dir: "/mnt/secondary/FIRE Investing Masterclass"
  repo: "git@github.com:MaddHatters/media-transcribe.git"
  analysis_dir: "analysis/"   # in-repo; mental model, OCR register, expert design

phases:
  - id: 1
    name: Transcription foundation
    status: done
    completed: 2026-06-24
    objectives:
      - Build a local, private transcription pipeline (faster-whisper turbo, parallel workers).
      - Per-course ticker/acronym correction dictionary, applied on write and re-runnable.
      - Stand up the repo with tests and AGENTS.md guardrails; push to GitHub.
      - Transcribe all 18 Masterclass videos to .txt + .srt.
    outputs:
      - "transcribe/ pipeline (transcribe.py, corrections.py, apply_corrections.py)"
      - "acquire/ tooling for future capture (OBS automation, yt-dlp)"
      - "18 transcripts (txt + srt) in transcripts_dir — 186k words"

  - id: 2
    name: Content analysis & mental model
    status: done
    started: 2026-06-25
    completed: 2026-06-25
    objectives:
      - >
        Extract the common themes/threads for picking & evaluating winning stocks:
        selection criteria, evaluation metrics/thresholds, how-to-buy rules,
        blueprint/portfolio-construction methodology, sell discipline.
      - >
        Build a structured mental model per domain (fundamentals, technicals,
        portfolio construction, psychology, options, personal finance) to seed
        the experts in Phase 4.
      - >
        Identify spots in the transcripts where a slide/chart/table/image is
        referenced but not fully explained in speech. Document each as an OCR
        candidate (episode + .srt timestamp + what's shown + why it matters).
    outputs:
      - "analysis/mental-model.md   — consolidated methodology & themes"
      - "analysis/ocr-candidates.md — timestamped register of visuals needing OCR"
      - "analysis/expert-domains.md — proposed expert specializations (feeds Phase 4)"

  - id: 3
    name: OCR context capture
    status: done
    completed: 2026-06-25
    depends_on: [2]
    objectives:
      - "DONE: local/free text OCR of all 18 videos (PyAV keyframes + RapidOCR/ONNX), ~2,900 slides."
      - "DONE: reconciled recovered slide text vs the mental model — confirmed findings,
         fixed corrections (DGF->DGIF, DG 200-day, NVDA option strike, Barber-O'Dean turnover),
         recovered skipped numeric tables (full financial statements, pattern library, etc.)."
      - "DEFERRED: diagram/chart *vision* pass (candlestick diagrams, semiconductor flowchart
         hierarchy, emotion-cycle curve, hand-drawn pies) — text OCR gets labels, not shapes.
         Plan: local vision-LLM POC on the M4 Mac mini (free + private; GPU/ANE makes it viable
         there, vs CPU-only here)."
    outputs:
      - "Per-episode slide text at <videos>/ocr/<stem>/slides.{md,json} (gitignored)"
      - "analysis/ocr-reconciliation.md — corrections + recovered reference data"

  - id: 4
    name: Build the experts
    status: in_progress
    started: 2026-06-25
    progress:
      - "Architecture chosen: deterministic core (tested Python) + LLM/agent wrapper."
      - "DONE: experts/dividend_classifier.py (DGIF/DGI/Income/Growth), 9 tests, verified on example tickers."
      - "DONE: Buy/Sell Point Engine in finance-suite (branch feat/buy-sell-engine-primitives):
         Fractals.get_levels (S/R+conviction), indicators (MA/RSI/Fib/air_pocket), engine.py
         (build_buy_plan/build_sell_plan + house-shares). 24 tests. Air-pocket thresholds PROVISIONAL
         pending chart-day-video calibration."
      - "DONE: experts/financial_statement_analyst.py (ratio/threshold health scorecard),
         validated against the OCR'd NVIDIA/Tesla/Wingstop statements. 37 tests total in media-transcribe."
      - "DONE: Financial-Statement Analyst + sector profiles wired (suppress D/E for banks,
         REIT payout-exempt); statement ingestion in finance-suite (EDGAR+yfinance+reconcile,
         10-Q, GICS->profile)."
      - "DONE: experts/statement_adapter.py — ingestion->FSA bridge: maps finance-suite's
         canonical FinancialStatements onto FSA inputs (assembles revenue_history across years,
         splices net_income into cash flow), selects the sector profile via the
         gics_to_profile/profile_spec contract. Duck-typed, no cross-repo import. 45 tests total."
      - "NEXT: Bull/Bear/Judge + perspective personas (LLM synthesis layer); agent/router layer (format TBD)."
    depends_on: [2, 3]
    objectives:
      - >
        For each domain identified in Phase 2, build a specialized expert agent
        (single focus, high accuracy) grounded in the mental model + OCR context.
      - Define each expert's scope, inputs/outputs, methodology, and guardrails.
      - Compose experts so a ticker/portfolio question routes to the right specialist(s).
    open_questions:
      - "Expert format: Claude Code subagents, an expertise.yaml system, or standalone prompts?"
      - "Single composite analyst vs. a panel of specialists with a router?"

  - id: 5
    name: Validate experts against the real portfolio
    status: planned
    depends_on: [4]
    requires:
      - "Statement ingestion (analysis/statement-ingestion.md): SEC EDGAR XBRL primary,
         shared GAAP-tag normalizer + per-company overrides, sector metric profiles
         (SaaS/bank/REIT/...). Data-bound -> finance-suite. Validate vs OCR'd statements."
    objectives:
      - Run the experts against tickers currently held in the portfolio.
      - Compare the experts' analysis to reality (fundamentals, performance, thesis).
      - Tune methodology/guardrails where the analysis diverges from observed outcomes.

  - id: 6
    name: Ingest the rest of the Masterclass library
    status: planned
    depends_on: [1]
    objectives:
      - Pull down remaining Masterclass videos not already on the drive.
      - Transcribe them with the Phase 1 pipeline; fold into the mental model & experts.

  - id: 7
    name: Scheduled ingestion, alerts & continual learning
    status: planned
    depends_on: [4, 5, 6]
    objectives:
      - >
        Pull down other Patreon content, plus recurring chart-day / Mon-Wed-Fri
        videos, on a schedule.
      - >
        Transcribe + analyze automatically and surface alerts: specific
        stock callouts and market insight — so watching the videos is optional.
      - >
        Keep the experts learning and improving as more material arrives, using a
        reinforcement-style feedback loop (predictions vs. outcomes inform tuning).
    open_questions:
      - "Alert channel (email, push, dashboard)?"
      - "What 'reward signal' grounds the reinforcement loop — realized returns, thesis accuracy?"

  - id: 8
    name: Consolidate & modularize shared functionality
    status: planned
    depends_on: [4, 5]
    objectives:
      - >
        Functionality is currently spread across repos with some duplication. Final pass:
        extract clean, shareable modules with well-defined contracts instead of scattered,
        disparate code. Decide the home for each concern and remove the duplication.
    consolidation_candidates:
      - "Canonical financial-statement schema is DUPLICATED: experts/financial_statement_analyst
         dataclasses (media-transcribe) vs financials/models (finance-suite). -> one shared package."
      - "Profile contract: FSA Profile (media-transcribe) vs financials.profile_spec (finance-suite)
         — align on one shared spec."
      - "Methodology-pure experts (dividend_classifier, FSA) live in media-transcribe; data-bound
         ones (Buy/Sell engine, statement ingestion) in finance-suite. Decide: shared 'experts'
         package, or consolidate data-bound experts into finance-suite, with the knowledge/methodology
         (analysis/, mental model, OCR) staying in media-transcribe."
      - "Repeated cross-repo tension throughout Phase 4 — needs explicit package boundaries +
         shared contracts (schemas, interfaces) so modules compose without copy/paste."
    open_questions:
      - "Shared code as a published package, a monorepo, or a git submodule / path dependency?"
